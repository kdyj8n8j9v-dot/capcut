# Исполнитель «Студии»: приложение на iPad запускает этот workflow через GitHub API (без Claude).
name: studio-worker
on:
  workflow_dispatch:
    inputs:
      job:     { description: "prepare | export", required: true, default: prepare }
      file:    { description: "prepare: имя оригинала в MEGA IN", required: false, default: "" }
      req:     { description: "номер задания: приложение находит по нему свой запуск; export — проект в MEGA «10 бит/.studio/jobs/<номер>.json»; selftest — проверка сборки", required: false, default: "" }
run-name: "${{ inputs.job }} ${{ inputs.req }}"
concurrency: { group: "studio-${{ inputs.job }}-${{ inputs.file }}${{ inputs.req }}", cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
      MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg, MEGAcmd, python
        timeout-minutes: 15
        run: |
          # каждая установка — с ограничением по времени и повтором: зависшая загрузка не должна держать задание часами
          retry() { local t=$1; shift; for i in 1 2 3; do timeout "$t" "$@" && return 0; echo "не вышло, повтор $i: $1 $2"; sleep 5; done; return 1; }
          retry 180 sudo apt-get update -qq
          retry 300 sudo apt-get install -y -qq ffmpeg >/dev/null
          # 10 бит 4:2:2 должен кодироваться — иначе не тратим время
          ffmpeg -v error -f lavfi -i testsrc=s=64x64:d=0.1 -pix_fmt yuv422p10le -c:v libx265 -profile:v main422-10 -f null -
          . /etc/os-release
          retry 150 curl -sSfL --connect-timeout 20 -o /tmp/mega.deb "https://mega.nz/linux/repo/xUbuntu_${VERSION_ID}/amd64/megacmd-xUbuntu_${VERSION_ID}_amd64.deb"
          retry 300 sudo apt-get install -y -qq /tmp/mega.deb >/dev/null
          retry 300 pip install -q numpy opencv-python-headless faster-whisper
          retry 180 npm install --no-save --silent @napi-rs/canvas   # субтитры рисует тот же код, что и превью в приложении
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-large-v3-turbo }
      - name: run
        env: { JOB: "${{ inputs.job }}", FILE: "${{ inputs.file }}", REQ: "${{ inputs.req }}" }
        run: |
          [ -z "$FILE" ] || echo "::add-mask::$FILE"
          if [ "$JOB" = export ]; then
            bash worker/run.sh export "$REQ"
          else
            bash worker/run.sh prepare "$FILE"
          fi
