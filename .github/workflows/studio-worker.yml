# Исполнитель «Студии»: приложение на iPad запускает этот workflow через GitHub API (без Claude).
name: studio-worker
on:
  workflow_dispatch:
    inputs:
      job:     { description: "prepare | export", required: true, default: prepare }
      file:    { description: "prepare: имя оригинала в MEGA IN", required: false, default: "" }
      req:     { description: "номер задания: приложение находит по нему свой запуск; export — проект в MEGA «10 бит/.studio/jobs/<номер>.json»; selftest — проверка сборки", required: false, default: "" }
run-name: "${{ inputs.job }} ${{ inputs.req }}"
concurrency: { group: "studio-${{ inputs.job }}-${{ inputs.file }}${{ inputs.req }}", cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
      MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg, MEGAcmd, python
        timeout-minutes: 20
        run: |
          # каждая установка — с жёстким ограничением по времени (timeout под sudo, SIGKILL через 10 с) и повтором;
          # если зеркало Ubuntu у GitHub (azure) не отвечает — переключаемся на archive.ubuntu.com
          APT="-o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 -o DPkg::Lock::Timeout=60"
          mirror() {
            echo "зеркало Ubuntu не отвечает — переключаюсь на archive.ubuntu.com"
            [ -f /etc/apt/apt-mirrors.txt ] && printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          }
          up() { echo "apt update…"; sudo timeout -k 10 150 apt-get $APT update -qq; }
          inst() { echo "установка: $*"; sudo timeout -k 10 420 apt-get $APT install -y -qq "$@" >/dev/null; }
          retry() { local t=$1; shift; for i in 1 2 3; do timeout -k 10 "$t" "$@" && return 0; echo "не вышло, повтор $i: $1 $2"; sleep 5; done; return 1; }
          up || { mirror; up; } || { sleep 20; up; }
          inst ffmpeg || { mirror; up; inst ffmpeg; }
          # 10 бит 4:2:2 должен кодироваться — иначе не тратим время
          ffmpeg -v error -f lavfi -i testsrc=s=64x64:d=0.1 -pix_fmt yuv422p10le -c:v libx265 -profile:v main422-10 -f null -
          . /etc/os-release
          retry 150 curl -sSfL --connect-timeout 20 -o /tmp/mega.deb "https://mega.nz/linux/repo/xUbuntu_${VERSION_ID}/amd64/megacmd-xUbuntu_${VERSION_ID}_amd64.deb"
          inst /tmp/mega.deb || { mirror; up; inst /tmp/mega.deb; }
          retry 300 pip install -q numpy opencv-python-headless faster-whisper
          retry 180 npm install --no-save --silent @napi-rs/canvas   # субтитры и наложения рисует тот же код, что и превью в приложении
          echo "установлено"
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-large-v3-turbo }
      - name: run
        env: { JOB: "${{ inputs.job }}", FILE: "${{ inputs.file }}", REQ: "${{ inputs.req }}" }
        run: |
          [ -z "$FILE" ] || echo "::add-mask::$FILE"
          if [ "$JOB" = export ]; then
            bash worker/run.sh export "$REQ"
          else
            bash worker/run.sh prepare "$FILE"
          fi
