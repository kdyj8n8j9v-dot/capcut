# Исполнитель «Студии»: приложение на iPad запускает этот workflow через GitHub API (без Claude).
name: studio-worker
on:
  workflow_dispatch:
    inputs:
      job:     { description: "prepare | export", required: true, default: prepare }
      file:    { description: "prepare: имя оригинала в MEGA IN", required: false, default: "" }
      req:     { description: "номер задания: приложение находит по нему свой запуск; export — проект в MEGA «10 бит/.studio/jobs/<номер>.json»; selftest — проверка сборки", required: false, default: "" }
run-name: "${{ inputs.job }} ${{ inputs.req }}"
concurrency: { group: "studio-${{ inputs.job }}-${{ inputs.file }}${{ inputs.req }}", cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
      MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      # быстрый путь: программы лежат в кэше GitHub и ставятся оттуда за секунды, без медленных зеркал;
      # сеть нужна только при первом запуске или когда кэш устарел (тогда он пересобирается сам)
      - uses: actions/cache/restore@v4
        with: { path: "~/tools", key: "tools-ubuntu24-v1-${{ github.run_id }}", restore-keys: "tools-ubuntu24-v1-" }
      - id: tools
        name: ffmpeg, MEGAcmd, python
        timeout-minutes: 20
        run: |
          T=~/tools; mkdir -p $T/debs $T/pip $T/npm
          ok() { ffmpeg -v error -f lavfi -i testsrc=s=64x64:d=0.1 -pix_fmt yuv422p10le -c:v libx265 -profile:v main422-10 -f null - 2>/dev/null && command -v mega-put >/dev/null; }
          if ls $T/debs/*.deb >/dev/null 2>&1 && sudo timeout -k 10 180 dpkg -i $T/debs/*.deb >/dev/null 2>&1 && ok; then
            echo "программы из кэша"
          else
            # медленный путь: сеть. Жёсткие тайм-ауты; если зеркало GitHub (azure) не отвечает — archive.ubuntu.com
            echo "кэша нет или он устарел — качаю"; echo "fresh=1" >> "$GITHUB_OUTPUT"
            rm -f $T/debs/*.deb
            APT="-o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 -o DPkg::Lock::Timeout=60"
            mirror() {
              echo "зеркало Ubuntu не отвечает — переключаюсь на archive.ubuntu.com"
              [ -f /etc/apt/apt-mirrors.txt ] && printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            }
            up() { echo "apt update…"; sudo timeout -k 10 90 apt-get $APT update -qq; }
            inst() { echo "установка: $*"; sudo timeout -k 10 420 apt-get $APT install -y -qq "$@" >/dev/null; }
            . /etc/os-release
            timeout -k 10 150 curl -sSfL --retry 3 --connect-timeout 20 -o $T/debs/megacmd.deb "https://mega.nz/linux/repo/xUbuntu_${VERSION_ID}/amd64/megacmd-xUbuntu_${VERSION_ID}_amd64.deb"
            up || { mirror; up; } || { sleep 10; up; }
            sudo timeout -k 10 300 apt-get $APT -f install -y -qq >/dev/null 2>&1 || true   # если кэш поставился наполовину
            inst ffmpeg $T/debs/megacmd.deb || { mirror; up; inst ffmpeg $T/debs/megacmd.deb; }
            cp /var/cache/apt/archives/*.deb $T/debs/ 2>/dev/null || true   # всё, что скачали, — в кэш на следующий раз
            ok || { echo "ffmpeg не кодирует 10 бит 4:2:2 или нет MEGAcmd" >&2; exit 1; }
          fi
          timeout -k 10 600 pip install -q --cache-dir $T/pip numpy opencv-python-headless faster-whisper
          timeout -k 10 300 npm install --no-save --silent --cache $T/npm @napi-rs/canvas   # субтитры и наложения рисует тот же код, что и превью
          echo "установлено"
      # новый кэш сохраняется сразу (и только когда программы качались заново), чтобы следующий запуск шёл быстрым путём
      - if: steps.tools.outputs.fresh == '1'
        uses: actions/cache/save@v4
        with: { path: "~/tools", key: "tools-ubuntu24-v1-${{ github.run_id }}" }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-large-v3-turbo }
      - name: run
        env: { JOB: "${{ inputs.job }}", FILE: "${{ inputs.file }}", REQ: "${{ inputs.req }}" }
        run: |
          [ -z "$FILE" ] || echo "::add-mask::$FILE"
          if [ "$JOB" = export ]; then
            bash worker/run.sh export "$REQ"
          else
            bash worker/run.sh prepare "$FILE"
          fi
